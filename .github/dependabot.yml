# Dependencias al día con PR pequeños y títulos Conventional Commits ("chore(deps): …").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(deps)" }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: uv
    directory: /apps/backend
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(deps)" }
    groups:
      python-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/frontend
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(deps)" }
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "@angular-eslint/*"]
      npm-menores:
        update-types: [minor, patch]
    ignore:
      # TypeScript va acompasado con Angular: se sube cuando Angular lo soporte, no antes
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/apps/backend, /apps/frontend]
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(deps)" }
    ignore:
      # Node se queda en la LTS (24) hasta que decidamos el salto; Python 3.14 igual
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
