# Publicación de imágenes y entrega continua (F2.3 y F2.4 del agentic-platform-lab).
#
#  · push a main  → construye back y front, sube a GHCR (sha-<commit>) con SBOM y procedencia,
#                   analiza con Grype (falla con CRITICAL corregibles) y firma el digest con cosign
#                   keyless. Siempre se publican las dos: cada commit de main tiene su pareja de imágenes.
#                   Después → PR a dev en platform-gitops que se fusiona solo si pasa gitops-ok.
#  · release      → NO reconstruye: re-etiqueta como X.Y.Z el MISMO digest de sha-<commit del tag>
#                   ("build once"). Staging y prod usarán exactamente lo que se probó en dev.
#                   Después → PR a staging en platform-gitops, que fusiona una persona.
#  · prod         → workflow promote.yml (a mano, con aprobación).
name: publish

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/elpalmeral-org/meridian-orders

jobs:
  build:
    name: publicar · ${{ matrix.app }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # subir a GHCR
      id-token: write # cosign keyless: identidad OIDC del workflow ante Sigstore
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=meridian-orders-${{ matrix.app }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max # procedencia SLSA adjunta a la imagen
          sbom: true # SBOM SPDX adjunto a la imagen
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Vulnerabilidades (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true # solo bloquean las que ya tienen corrección publicada
          output-format: table
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Firmar el digest (cosign keyless)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Resumen
        env:
          APP: ${{ matrix.app }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### $APP"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Imagen | \`$IMAGE\` |"
            echo "| Tag | \`$TAGS\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Firma | cosign keyless ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: etiquetar release · ${{ matrix.app }}
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Re-etiquetar el mismo digest como X.Y.Z
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG_NAME#v}"
          source_tag="sha-${GITHUB_SHA::7}"
          # La release se crea justo tras el merge del PR de release: el build de ese commit
          # puede estar aún en marcha. Esperamos hasta 20 min a que exista sha-<commit>.
          for _ in $(seq 1 40); do
            if digest=$(docker buildx imagetools inspect "$IMAGE:$source_tag" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest); then
              break
            fi
            echo "esperando a $IMAGE:$source_tag…"; sleep 30
          done
          [ -n "${digest:-}" ] || { echo "::error::No existe $IMAGE:$source_tag"; exit 1; }

          # Solo se promociona lo que firmó el workflow de publicación de main
          cosign verify "$IMAGE@$digest" \
            --certificate-identity "https://github.com/$REPO/.github/workflows/publish.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

          docker buildx imagetools create --tag "$IMAGE:$version" "$IMAGE@$digest"
          {
            echo "### ${{ matrix.app }} → $version"
            echo "Mismo digest que \`$source_tag\`: \`$digest\` (firma verificada)"
          } >> "$GITHUB_STEP_SUMMARY"

  dev:
    name: promocionar
    needs: build
    if: github.event_name == 'push'
    permissions: {}
    uses: ./.github/workflows/_promote.yml
    with:
      environment: dev
      auto-merge: true
    secrets:
      PLATFORM_BOT_PRIVATE_KEY: ${{ secrets.PLATFORM_BOT_PRIVATE_KEY }}

  staging:
    name: promocionar
    needs: release
    if: github.event_name == 'release'
    permissions: {}
    uses: ./.github/workflows/_promote.yml
    with:
      environment: staging
      tag: ${{ github.event.release.tag_name }}
    secrets:
      PLATFORM_BOT_PRIVATE_KEY: ${{ secrets.PLATFORM_BOT_PRIVATE_KEY }}
