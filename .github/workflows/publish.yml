# Publicación de imágenes y entrega continua (F2.3 y F2.4 del agentic-platform-lab).
#
#  · push a main  → construye back y front, sube a GHCR (sha-<commit>) con SBOM y procedencia,
#                   analiza con Grype (falla con CRITICAL corregibles) y firma el digest con cosign
#                   keyless. Siempre se publican las dos: cada commit de main tiene su pareja de imágenes.
#                   Después → PR a dev en platform-gitops que se fusiona solo si pasa gitops-ok.
#  · release      → NO reconstruye: re-etiqueta como X.Y.Z el MISMO digest de sha-<commit del tag>
#                   ("build once"). Staging y prod usarán exactamente lo que se probó en dev.
#                   Después → PR a staging en platform-gitops, que fusiona una persona.
#  · prod         → workflow promote.yml (a mano, con aprobación).
name: publish

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/elpalmeral-org/meridian-orders

jobs:
  build:
    name: publicar · ${{ matrix.app }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # subir a GHCR
      id-token: write # cosign keyless: identidad OIDC del workflow ante Sigstore
      pull-requests: read # linaje: PR que originó el commit
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=meridian-orders-${{ matrix.app }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max # procedencia SLSA adjunta a la imagen
          sbom: true # SBOM SPDX adjunto a la imagen
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Vulnerabilidades (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true # solo bloquean las que ya tienen corrección publicada
          output-format: table
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Firmar el digest (cosign keyless)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}@${{ steps.build.outputs.digest }}
        # El servicio de tokens OIDC de GitHub responde a veces con un error transitorio en texto
        # ("upstream connect error…") y cosign falla con "invalid character 'u'". 3 intentos.
        run: |
          for i in 1 2 3; do
            if cosign sign --yes "$IMAGE"; then exit 0; fi
            echo "::warning::cosign sign falló (intento $i/3); reintento en $((i * 15)) s"
            sleep $((i * 15))
          done
          exit 1
      - name: Resumen
        env:
          APP: ${{ matrix.app }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### $APP"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Imagen | \`$IMAGE\` |"
            echo "| Tag | \`$TAGS\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Firma | cosign keyless ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"
      # Linaje (F3.4b · ADR 0020): lo que solo sabe este pipeline. La firma NO se declara aquí:
      # la verifica la plataforma al registrar el build (port-lineage en platform-gitops).
      - id: lineage
        name: Linaje · datos del build
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)"
          json="$(jq -nc --arg app "$APP" --arg img "$IMAGE" --arg digest "$DIGEST" --arg sha "$GITHUB_SHA" \
            --arg run "$RUN_URL" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg pr "$pr" '
            {identifier: ("meridian-orders-" + $app + "-" + ($digest | ltrimstr("sha256:"))),
             title: ($app + " sha-" + $sha[0:7]),
             properties: {image: ($img + "@" + $digest), tag: ("sha-" + $sha[0:7]), component: $app,
                          commit: $sha, built_at: $now, workflow_run_url: $run,
                          sbom: true, provenance: true,
                          critical_cves: 0},
             relations: ({service: "meridian-orders"} + (if $pr != "" then {pull_request: ("meridian-orders-" + $pr)} else {} end))}')"
          echo "json=$json" >> "$GITHUB_OUTPUT"
      # critical_cves = 0: Grype ya ha bloqueado el build si había alguna CRITICAL con corrección
      - name: Linaje · registrar el build en Port
        uses: elpalmeral-org/platform-gitops/.github/actions/port-entity@534fb6e86846c5e9b13230090115906dfaf96a79 # main · F3.4a
        with:
          blueprint: build
          entities: ${{ steps.lineage.outputs.json }}
          client-id: ${{ secrets.PORT_CLIENT_ID }}
          client-secret: ${{ secrets.PORT_CLIENT_SECRET }}
          create-missing-related: "true" # el PR puede llegar a Port después (GitHub Ocean)

  release:
    name: etiquetar release · ${{ matrix.app }}
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Re-etiquetar el mismo digest como X.Y.Z
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG_NAME#v}"
          source_tag="sha-${GITHUB_SHA::7}"
          identity="https://github.com/$REPO/.github/workflows/publish.yml@refs/heads/main"
          # La release se crea justo tras el merge del PR de release, y el build de ese commit
          # puede estar en cola o en marcha. Ojo: el tag sha-<commit> aparece en GHCR ANTES de la
          # firma (entre medias va Grype), así que no basta con que exista: esperamos hasta 20 min
          # a que exista Y esté firmado por publish.yml en main. Solo eso se promociona.
          digest=""
          for _ in $(seq 1 40); do
            if d=$(docker buildx imagetools inspect "$IMAGE:$source_tag" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest) \
              && cosign verify "$IMAGE@$d" --certificate-identity "$identity" \
                   --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null 2>&1; then
              digest="$d"
              break
            fi
            echo "esperando a $IMAGE:$source_tag firmada…"; sleep 30
          done
          [ -n "$digest" ] || { echo "::error::$IMAGE:$source_tag no existe o no está firmada por publish.yml en main"; exit 1; }

          docker buildx imagetools create --tag "$IMAGE:$version" "$IMAGE@$digest"
          {
            echo "### ${{ matrix.app }} → $version"
            echo "Mismo digest que \`$source_tag\`: \`$digest\` (firma verificada)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Linaje de la release: enlaza la release (que crea GitHub Ocean) con los dos builds re-etiquetados
  release-lineage:
    name: linaje · release
    needs: release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - id: lineage
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          builds="[]"
          for app in backend frontend; do
            digest="$(docker buildx imagetools inspect "$IMAGE_PREFIX-$app:$version" --format '{{json .Manifest}}' | jq -r .digest)"
            builds="$(jq -c --arg b "meridian-orders-$app-${digest#sha256:}" '. + [$b]' <<<"$builds")"
          done
          json="$(jq -nc --arg id "meridian-orders-$TAG_NAME" --arg v "$version" --argjson b "$builds" \
            '{identifier: $id, properties: {version: $v}, relations: {service: "meridian-orders", builds: $b}}')"
          echo "json=$json" >> "$GITHUB_OUTPUT"
      - uses: elpalmeral-org/platform-gitops/.github/actions/port-entity@534fb6e86846c5e9b13230090115906dfaf96a79 # main · F3.4a
        with:
          blueprint: release
          entities: ${{ steps.lineage.outputs.json }}
          client-id: ${{ secrets.PORT_CLIENT_ID }}
          client-secret: ${{ secrets.PORT_CLIENT_SECRET }}
          create-missing-related: "true"

  dev:
    name: promocionar
    needs: build
    if: github.event_name == 'push'
    permissions: {}
    uses: ./.github/workflows/_promote.yml
    with:
      environment: dev
      auto-merge: true
    secrets:
      PLATFORM_BOT_PRIVATE_KEY: ${{ secrets.PLATFORM_BOT_PRIVATE_KEY }}

  staging:
    name: promocionar
    needs: release
    if: github.event_name == 'release'
    permissions: {}
    uses: ./.github/workflows/_promote.yml
    with:
      environment: staging
      tag: ${{ github.event.release.tag_name }}
    secrets:
      PLATFORM_BOT_PRIVATE_KEY: ${{ secrets.PLATFORM_BOT_PRIVATE_KEY }}
