# Motor A · IMPLEMENT (F5, ADR 0025, ADR 0031, ADR 0033). Equivalente, por el motor A, a la Fase B
# de /feature: implementer + los tres validadores vía HarnessRouter, antes de abrir el PR de
# código. Hoy solo comprueba que meridian/implementer está publicado (harness-sync, F4.7); llamar
# de verdad al rol (POST /api/harness/v1/responses) y abrir el PR con el resultado es trabajo
# posterior a la prueba de humo, no de este workflow todavía.
name: aidlc-implement

on:
  workflow_dispatch:
    inputs:
      cambio:
        description: Nombre del cambio OpenSpec ya aprobado (fusionado en main)
        required: true

permissions: {}

jobs:
  implement:
    name: implementer + validadores vía HarnessRouter (motor A)
    runs-on: arc-aidlc
    steps:
      - name: Precondición (igual que implementer.agent.md) y GET /v1/harnesses
        env:
          HARNESSROUTER_API_KEY: ${{ secrets.HARNESSROUTER_API_KEY }}
        run: |
          echo "cambio: ${{ inputs.cambio }}"
          status=$(curl -s -o /tmp/harnesses.json -w '%{http_code}' --max-time 10 \
            -H "Authorization: Bearer $HARNESSROUTER_API_KEY" \
            http://harnessrouter.harnessrouter.svc.cluster.local:3000/api/harness/v1/harnesses)
          echo "HTTP $status"
          cat /tmp/harnesses.json
          if [ "$status" != "200" ]; then
            echo "::error::GET /api/harness/v1/harnesses devolvió HTTP $status, no 200." \
                 "Revisa HARNESSROUTER_API_KEY (secreto de este repo) o la Console de HarnessRouter."
            exit 1
          fi
          if ! jq -e '.harnesses[] | select(.name == "meridian/implementer")' /tmp/harnesses.json > /dev/null 2>&1; then
            echo "::error::HarnessRouter responde, pero meridian/implementer no está publicado" \
                 "todavía (harness-sync, F4.7)."
            exit 1
          fi
          echo "meridian/implementer encontrado; el resto (implementer + 3 validadores, PR con" \
               "el código) llega cuando F4.7 conecte un proveedor real."
