# Motor A · PROPOSE (F5, ADR 0025 ADR 0031, ADR 0033). Lo dispara el workflow "Pedir feature" de
# Port. Equivalente, por el motor A, a la Fase A de /feature
# (platform-harness/.apm/prompts/feature.prompt.md): llama a HarnessRouter (UHP) para que el rol
# meridian/spec-writer@X.Y.Z proponga el cambio OpenSpec.
#
# Hoy solo comprueba que meridian/spec-writer está publicado (harness-sync, F4.7); llamar de
# verdad al rol (POST /api/harness/v1/responses) y abrir el PR con la spec resultante es trabajo
# posterior a la prueba de humo, no de este workflow todavía.
name: aidlc-propose

on:
  workflow_dispatch:
    inputs:
      cambio:
        description: Nombre del cambio OpenSpec, en kebab-case
        required: true
      peticion:
        description: Petición en lenguaje natural
        required: true

permissions: {}

jobs:
  propose:
    name: spec-writer vía HarnessRouter (motor A)
    runs-on: arc-aidlc
    steps:
      - name: GET /v1/harnesses
        env:
          HARNESSROUTER_API_KEY: ${{ secrets.HARNESSROUTER_API_KEY }}
        run: |
          echo "cambio: ${{ inputs.cambio }}"
          echo "petición: ${{ inputs.peticion }}"
          status=$(curl -s -o /tmp/harnesses.json -w '%{http_code}' --max-time 10 \
            -H "Authorization: Bearer $HARNESSROUTER_API_KEY" \
            http://harnessrouter.harnessrouter.svc.cluster.local:3000/api/harness/v1/harnesses)
          echo "HTTP $status"
          cat /tmp/harnesses.json
          if [ "$status" != "200" ]; then
            echo "::error::GET /api/harness/v1/harnesses devolvió HTTP $status, no 200." \
                 "Revisa HARNESSROUTER_API_KEY (secreto de este repo) o la Console de HarnessRouter."
            exit 1
          fi
          if ! jq -e '.harnesses[] | select(.name == "meridian/spec-writer")' /tmp/harnesses.json > /dev/null 2>&1; then
            echo "::error::HarnessRouter responde, pero meridian/spec-writer no está publicado todavía" \
                 "(harness-sync, F4.7)."
            exit 1
          fi
          echo "meridian/spec-writer encontrado; el resto (POST /v1/responses, PR con la spec)" \
               "llega cuando F4.7 conecte un proveedor real."
