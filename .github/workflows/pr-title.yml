# El título del PR es el mensaje del commit tras el squash: debe seguir Conventional Commits
# para que release-please calcule la versión y el CHANGELOG.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: conventional-commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            backend
            frontend
            spec
            ci
            deps
            release
          requireScope: false
