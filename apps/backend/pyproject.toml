[project]
name = "meridian-orders-backend"
version = "0.1.0" # la gestiona release-please (una sola versión para todo el producto)
description = "API de Meridian Orders (FastAPI)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54,<0.55",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "psycopg[binary]>=3.3,<3.4",
  "pydantic-settings>=2.16,<2.17",
  "prometheus-client>=0.26,<0.27",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<9.2",
  "pytest-cov>=7.1,<7.2",
  "httpx>=0.28,<0.29",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_orders"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = ["B008"] # Depends() en valores por defecto es el patrón de FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/**" = ["N999"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
packages = ["meridian_orders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=meridian_orders --cov-report=term-missing --cov-fail-under=90"
